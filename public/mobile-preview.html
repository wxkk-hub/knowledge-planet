<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识星球 - 手机预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 20px;
    background-image:
      radial-gradient(ellipse at 20% 50%, #16213e 0%, transparent 60%),
      radial-gradient(ellipse at 80% 50%, #1a1a2e 0%, transparent 60%),
      linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #0f0f23 100%);
  }
  .preview-container { display: flex; flex-direction: column; align-items: center; gap: 24px; }
  .phone-frame {
    position: relative; width: 375px; height: 812px;
    background: #000; border-radius: 44px; padding: 12px;
    box-shadow: 0 0 0 2px #333, 0 0 0 4px #222, 0 20px 60px rgba(0,0,0,0.6), 0 0 120px rgba(255,104,53,0.08);
  }
  .phone-notch {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    width: 150px; height: 30px; background: #000;
    border-radius: 0 0 18px 18px; z-index: 10;
  }
  .phone-notch::before {
    content: ''; position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    width: 10px; height: 10px; background: #1a1a2e; border-radius: 50%; border: 2px solid #222;
  }
  .phone-screen {
    width: 100%; height: 100%; border-radius: 32px;
    overflow: hidden; background: #f5f5f5; position: relative;
  }
  .phone-screen iframe { width: 100%; height: 100%; border: none; }
  .phone-home-indicator {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 5px; background: rgba(0,0,0,0.15); border-radius: 100px; z-index: 10;
  }
  .device-info {
    display: flex; align-items: center; gap: 16px;
    color: rgba(255,255,255,0.5); font-size: 13px;
  }
  .page-nav { display: flex; gap: 8px; margin-top: 8px; }
  .page-nav a {
    padding: 8px 20px; background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 20px;
    color: rgba(255,255,255,0.6); text-decoration: none;
    font-size: 13px; transition: all 0.2s;
  }
  .page-nav a:hover { background: rgba(255,104,53,0.15); border-color: #FF6835; color: #FF6835; }
  @media (max-width: 480px) {
    .phone-frame { width: 320px; height: 700px; border-radius: 32px; padding: 8px; }
    .phone-screen { border-radius: 24px; }
    .phone-notch { display: none; }
    .page-nav { flex-wrap: wrap; justify-content: center; }
  }
</style>
</head>
<body>
  <div class="preview-container">
    <div class="device-info"><span>iPhone 14 Pro - 375x812</span></div>
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="phone-screen">
        <iframe src="/" name="preview"></iframe>
      </div>
      <div class="phone-home-indicator"></div>
    </div>
    <div class="page-nav">
      <a href="/" target="preview">首页</a>
      <a href="/category" target="preview">分类</a>
      <a href="/mine" target="preview">我的</a>
      <a href="/login" target="preview">登录</a>
    </div>
  </div>
</body>
</html>
